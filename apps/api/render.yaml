# Render Blueprint — Infrastructure-as-Code for the JobMatch API
# Documentation: https://render.com/docs/blueprint-spec
# Deploy: connect this repo to Render, it auto-detects this file

services:
  - type: web
    name: jobmatch-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobmatch-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: jobmatch-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: "15m"
      - key: JWT_REFRESH_EXPIRY
        value: "7d"
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: jobmatch-web
          property: host
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: jobmatch-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
