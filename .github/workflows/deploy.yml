name: CD — Deploy to Vercel

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Deploy API to Vercel"
        type: boolean
        default: true
      deploy_web:
        description: "Deploy Web to Vercel"
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ──────────────────────────────────────────────
  # 1. DEPLOY FRONTEND TO VERCEL
  # ──────────────────────────────────────────────
  deploy-web:
    name: Deploy Frontend → Vercel
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        working-directory: apps/web
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: latest # Forces installation of a supported Vercel CLI version
          vercel-build: true # <--- Fix: Tells the action to pull & compile local packages
          target: production
          # FIX: Run from root and point Vercel to your subfolder configuration
          working-directory: ./ 
          vercel-args: "--cwd apps/web"

  # ──────────────────────────────────────────────
  # 2. DEPLOY BACKEND TO VERCEL (serverless)
  # ──────────────────────────────────────────────
  deploy-api:
    name: Deploy Backend → Vercel (Serverless)
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Build API
        working-directory: apps/api
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_API_PROJECT_ID }}
          vercel-version: latest # Forces installation of a supported Vercel CLI version
          vercel-build: true # <--- Fix: Tells the action to pull & compile local packages
          target: production
          # FIX: Run from root and point Vercel to your subfolder configuration
          working-directory: ./
          vercel-args: "--cwd apps/api"
