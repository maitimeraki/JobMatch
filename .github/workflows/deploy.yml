name: CD — Deploy to Vercel
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Deploy API to Vercel"
        type: boolean
        default: true
      deploy_web:
        description: "Deploy Web to Vercel"
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ──────────────────────────────────────────────
  # 1. DEPLOY FRONTEND TO VERCEL
  # ──────────────────────────────────────────────
  deploy-web:
    name: Deploy Frontend → Vercel
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install Project Dependencies
        run: npm ci

      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Locally
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web

      # FIX: Copy the local vercel configuration metadata to the root folder so the deploy agent sees your shared node_modules
      - name: Link Build Output to Root
        run: rm -rf .vercel && cp -r apps/web/.vercel .vercel

      - name: Deploy Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ──────────────────────────────────────────────
  # 2. DEPLOY BACKEND TO VERCEL (serverless)
  # ──────────────────────────────────────────────
  deploy-api:
    name: Deploy Backend → Vercel (Serverless)
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      #################################################################
      # Install ALL workspace dependencies
      #################################################################

      - name: Install dependencies
        run: npm ci

      #################################################################
      # Build the shared workspace package
      #################################################################

      - name: Build Shared Package
        run: npm --workspace @jobmatch/shared run build

      #################################################################
      # Verify workspace
      #################################################################

      - name: Verify Shared Package
        run: |
          echo "===== Shared dist ====="
          ls -R packages/shared/dist

          echo ""
          echo "===== Workspace link ====="
          ls -l node_modules/@jobmatch

      #################################################################
      # Prisma
      #################################################################

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      #################################################################
      # Pull Vercel project
      #################################################################

      - name: Pull Vercel Environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd apps/api
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      #################################################################
      # Build
      #################################################################

      - name: Build with Vercel
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd apps/api

      #################################################################
      # Debug output
      #################################################################

      - name: Inspect Build Output
        run: |
          echo "===== Output ====="
          find apps/api/.vercel/output -maxdepth 5

          echo ""
          echo "===== Function ====="
          find apps/api/.vercel/output/functions/api/index.func -maxdepth 5

          echo ""
          echo "===== Shared ====="
          find apps/api/.vercel/output -name shared

      #################################################################
      # Fail if omitted
      #################################################################

      - name: Verify Shared In Function
        run: |
          if [ ! -d apps/api/.vercel/output/functions/api/index.func/node_modules/@jobmatch/shared ]; then
            echo "ERROR: @jobmatch/shared NOT packaged into Lambda."
            exit 1
          fi

      #################################################################
      # Link build
      #################################################################

      - name: Link Build Output
        run: |
          rm -rf .vercel
          cp -r apps/api/.vercel .vercel

      #################################################################
      # Deploy
      #################################################################

      - name: Deploy
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
