name: CD — Deploy to Vercel
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Deploy API to Vercel"
        type: boolean
        default: true
      deploy_web:
        description: "Deploy Web to Vercel"
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  # ──────────────────────────────────────────────
  # 1. DEPLOY FRONTEND TO VERCEL
  # ──────────────────────────────────────────────
  deploy-web:
    name: Deploy Frontend → Vercel
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install Project Dependencies
        run: npm ci

      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Locally
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/web

      # FIX: Copy the local vercel configuration metadata to the root folder so the deploy agent sees your shared node_modules
      - name: Link Build Output to Root
        run: rm -rf .vercel && cp -r apps/web/.vercel .vercel

      - name: Deploy Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ──────────────────────────────────────────────
  # 2. DEPLOY BACKEND TO VERCEL (serverless)
  # ──────────────────────────────────────────────
  deploy-api:
    name: Deploy Backend → Vercel (Serverless)
    if: ${{ github.event_name == 'push' || github.event.inputs.deploy_api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Build Shared Package
        working-directory: packages/shared
        run: npm run build

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/api
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

      - name: Build Project Locally
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd apps/api

      # FIX: Clear any old configurations and copy the api vercel metadata to the root folder before deploying
      - name: Link Build Output to Root
        run: rm -rf .vercel && cp -r apps/api/.vercel .vercel

      - name: Deploy Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
