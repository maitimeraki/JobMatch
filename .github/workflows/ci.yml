name: CI — Lint, TypeCheck & Build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # FIX 1: Compile the shared package first so the api and web apps can find its type declarations (.d.ts files)
      - name: Build Shared Package Types
        run: npm run build --workspace=@jobmatch/shared

      # FIX 2: Generate Prisma types early if your API typechecks rely on them
      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        continue-on-error: true # Prevents crash if prisma folder isn't under this exact name variant

      # FIX 3: Execute tsc from the ROOT using workspace parameters instead of working-directory shifts
      - name: TypeCheck shared package
        run: npm run typecheck --workspace=@jobmatch/shared
        continue-on-error: true # Skip if shared package doesn't have a custom typecheck script

      - name: Create vercel blob
        run: npm install @vercel/blob

      - name: TypeCheck API
        run: npx tsc --project apps/api/tsconfig.json --noEmit

      - name: TypeCheck Web
        run: npx tsc --project apps/web/tsconfig.json --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        
      # FIX 4: Consolidating build orders from root orchestration
      - name: Build Shared Package
        run: npm run build --workspace=@jobmatch/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        
      - name: Create vercel blob
        run: npm install @vercel/blob

      - name: Build API
        run: npm run build --workspace=api # Replace with your api package name string if different

      - name: Build Web
        run: npm run build --workspace=web # Replace with your web package name string if different

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3

      - name: Upload api dist
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist
          retention-days: 3
